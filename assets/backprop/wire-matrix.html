<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导线与矩阵</title>
<link rel="stylesheet" href="widget.css">
<div class="card">

<svg viewBox="0 0 660 300" role="img" aria-label="神经元连线与权重矩阵格子的一一对应">
 <g id="gw"></g><g id="gn"></g>
 <text class="t-sm" x="110" y="288" text-anchor="middle">&#19978;&#19968;&#23618; 3 &#20010;</text>
 <text class="t-sm" x="290" y="288" text-anchor="middle">&#36825;&#19968;&#23618; 2 &#20010;</text>
 <text class="t-sm" x="520" y="44" text-anchor="middle">&#26435;&#37325;&#30697;&#38453; W&#65288;2 &#34892; 3 &#21015;&#65289;</text>
 <g id="gc"></g>
 <text class="t-sm" x="520" y="256" text-anchor="middle" id="hint"></text>
</svg>
</div>
<script>
(function(){"use strict";
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function $(s){return document.querySelector(s)}
function sleep(ms){return new Promise(function(r){setTimeout(r,RM?0:ms)})}
function el(t,a,x){var e=document.createElementNS('http://www.w3.org/2000/svg',t);
for(var k in a)e.setAttribute(k,a[k]); if(x!=null)e.textContent=x; return e}

var AY=[95,165,235],ZY=[130,200],CX=[428,500,572],CY=[78,130],CW=68,CH=46;
var gw=$('#gw'),gn=$('#gn'),gc=$('#gc'),wires=[],cells=[];
for(var i=0;i<2;i++)for(var j=0;j<3;j++){
 var dd='M132 '+AY[j]+' L268 '+ZY[i];
 var p=el('path',{'class':'wire',d:dd}),h=el('path',{'class':'hitwire',d:dd});
 gw.appendChild(p);gw.appendChild(h);
 var r=el('rect',{'class':'cellr',x:CX[j],y:CY[i],width:CW,height:CH,rx:5,'stroke-width':1,style:'cursor:pointer'});
 var t=el('text',{'class':'t-val',x:CX[j]+CW/2,y:CY[i]+CH/2+4,'text-anchor':'middle',style:'fill:var(--ink-2)'},'W'+(i+1)+(j+1));
 gc.appendChild(r);gc.appendChild(t);wires.push(p);cells.push({r:r,t:t,h:h,i:i,j:j})}
['a\u2081','a\u2082','a\u2083'].forEach(function(s,k){
 gn.appendChild(el('circle',{'class':'node-c',cx:110,cy:AY[k],r:22,'stroke-width':1.2}));
 gn.appendChild(el('text',{'class':'t-lab',x:110,y:AY[k]+5,'text-anchor':'middle'},s))});
['z\u2081','z\u2082'].forEach(function(s,k){
 gn.appendChild(el('circle',{'class':'node-c',cx:290,cy:ZY[k],r:22,'stroke-width':1.2}));
 gn.appendChild(el('text',{'class':'t-lab',x:290,y:ZY[k]+5,'text-anchor':'middle'},s))});
['\u6765\u81ea a\u2081','\u6765\u81ea a\u2082','\u6765\u81ea a\u2083'].forEach(function(s,k){
 gc.appendChild(el('text',{'class':'t-sm',x:CX[k]+CW/2,y:70,'text-anchor':'middle'},s))});
['\u53bb\u5f80 z\u2081','\u53bb\u5f80 z\u2082'].forEach(function(s,k){
 gc.appendChild(el('text',{'class':'t-sm',x:420,y:CY[k]+CH/2+4,'text-anchor':'end'},s))});
var hint=$('#hint'),base='\u884c = \u53bb\u5f80\u54ea\u4e2a\u795e\u7ecf\u5143 \u00b7 \u5217 = \u6765\u81ea\u54ea\u4e2a\u795e\u7ecf\u5143';
function set(n){
 wires.forEach(function(w,k){w.classList.toggle('on-f',k===n)});
 cells.forEach(function(c,k){c.r.classList.toggle('hot',k===n);c.t.style.fill=(k===n?'var(--hot)':'var(--ink-2)')});
 hint.textContent = n<0?base:('W'+(cells[n].i+1)+(cells[n].j+1)+'\uff1a\u4ece a'+(cells[n].j+1)+' \u51fa\u53d1\uff0c\u901a\u5f80 z'+(cells[n].i+1));
 hint.style.fill = n<0?'var(--ink-3)':'var(--hot)'}
cells.forEach(function(c,k){[c.h,c.r].forEach(function(t){
 t.addEventListener('mouseenter',function(){set(k)});
 t.addEventListener('click',function(){set(k)})})});
$('#gw').addEventListener('mouseleave',function(){set(-1)});
$('#gc').addEventListener('mouseleave',function(){set(-1)});
set(-1);
})();
</script>
<script src="widget.js"></script>

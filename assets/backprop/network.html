(function(){"use strict";
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

for(var k in a)e.setAttribute(k,a[k]); if(x!=null)e.textContent=x; return e}

var ND=['n-x1','n-x2','n-h1','n-h2','n-o'];

function C(i,c,on){var e=document.getElementById(i); if(e)e.classList[on?'add':'remove'](c)}
function S(i,on){C(i,'show',on!==false)}
function reset(){VS.forEach(function(i){S(i,false)});
 WR.concat(ND).forEach(function(i){C(i,'on-f',false);C(i,'on-b',false)});
 nt.textContent='\u70b9\u4e00\u4e0b\u5f00\u59cb'}

 S('lay-w');S('v-x1');S('v-x2');C('n-x1','on-f',1);C('n-x2','on-f',1); await sleep(600);
 ['w-x1h1','w-x1h2','w-x2h1','w-x2h2'].forEach(function(i){C(i,'on-f',1)}); await sleep(500);
 S('v-h1');S('v-h2');C('n-h1','on-f',1);C('n-h2','on-f',1); await sleep(600);
 ['w-h1o','w-h2o'].forEach(function(i){C(i,'on-f',1)}); await sleep(500);
 S('v-o');C('n-o','on-f',1);S('loss-lab');
 nt.textContent='\u9884\u6d4b 0.485\uff0c\u771f\u5b9e 1.0 \u2192 L = 0.1324'; busy=false}
async function bwd(){ if(busy)return; busy=true;
 if(!document.getElementById('v-o').classList.contains('show')){await fwd(); await sleep(400); busy=true}
 WR.concat(ND).forEach(function(i){C(i,'on-f',false)});
 nt.textContent='\u53cd\u5411\uff1a\u8d23\u4efb\u6cbf\u539f\u8def\u9000\u56de';
 C('n-o','on-b',1);S('d-o'); await sleep(700);
 ['w-h1o','w-h2o'].forEach(function(i){C(i,'on-b',1)}); await sleep(500);
 S('d-h1');S('d-h2');C('n-h1','on-b',1);C('n-h2','on-b',1); await sleep(700);
 ['w-x1h1','w-x1h2','w-x2h1','w-x2h2'].forEach(function(i){C(i,'on-b',1)}); await sleep(500);
 S('d-x1');S('d-x2');C('n-x1','on-b',1);C('n-x2','on-b',1);

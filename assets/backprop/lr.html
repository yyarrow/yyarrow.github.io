<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习率</title>
<link rel="stylesheet" href="widget.css">
<div class="card">

<svg viewBox="0 0 660 300" role="img" aria-label="抛物线上的小球沿梯度反方向下降">
 <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
 <line x1="60" y1="252" x2="620" y2="252" stroke="var(--line)"/>
 <path id="bowl" d="" stroke="var(--line)" stroke-width="1.8" fill="none"/>
 <line id="tan" stroke="var(--hot)" stroke-width="1.8"/>
 <path id="arw" d="" stroke="var(--bwd)" stroke-width="2" fill="none" marker-end="url(#ah)" style="color:var(--bwd)"/>
 <circle id="ball" r="8" style="fill:var(--fwd)"/>
 <line x1="340" y1="56" x2="340" y2="258" stroke="var(--line)" stroke-dasharray="3 4"/>
 <text class="t-sm" x="340" y="274" text-anchor="middle">w = 3&#65288;&#30871;&#24213;&#65289;</text>
 <text class="t-sm" x="70" y="76">L</text>
 <text class="t-val" id="bl" text-anchor="middle" style="fill:var(--fwd)"></text>
</svg>
<div class="bar">
 <span>&#23398;&#20064;&#29575; &#951;</span>
 <input type="range" id="lr" min="0.01" max="1.3" step="0.01" value="0.15" aria-label="learning rate">
 <span class="v" id="lrv">0.15</span>
 <button id="b1">&#36208;&#19968;&#27493;</button><button id="b2">&#36830;&#36208; 12 &#27493;</button><button id="b3">&#22238;&#36215;&#28857;</button>
</div>
<div class="bar" style="border-top:none;padding-top:2px"><span id="msg"></span></div>
</div>
<script>
(function(){"use strict";
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function $(s){return document.querySelector(s)}
function sleep(ms){return new Promise(function(r){setTimeout(r,RM?0:ms)})}
function el(t,a,x){var e=document.createElementNS('http://www.w3.org/2000/svg',t);
for(var k in a)e.setAttribute(k,a[k]); if(x!=null)e.textContent=x; return e}

var W0=5.6,w=W0,lr=.15,run=false,X0=60,X1=620,Y0=252,mn=3,sp=3.2;
function px(v){return Math.max(46,Math.min(634,340+(v-mn)/sp*((X1-X0)/2)))}
function L(v){return (v-3)*(v-3)}
function py(v){return Y0-Math.min(L(v),8)/8*196}
var d='';for(var i=0;i<=120;i++){var t=mn-sp+i/120*sp*2; d+=(i?'L':'M')+px(t).toFixed(1)+' '+py(t).toFixed(1)+' '}
$('#bowl').setAttribute('d',d);
function draw(){var bx=px(w),by=py(w),g=2*(w-3);
 $('#ball').setAttribute('cx',bx);$('#ball').setAttribute('cy',by);
 var lb=$('#bl');lb.setAttribute('x',bx);lb.setAttribute('y',by-18);
 lb.textContent='w='+w.toFixed(2)+'  L\u2032='+g.toFixed(2);
 var sl=g*24.5/((X1-X0)/2/sp), sc=46/Math.sqrt(1+sl*sl), t=$('#tan');
 t.setAttribute('x1',bx-sc);t.setAttribute('y1',by+sl*sc);
 t.setAttribute('x2',bx+sc);t.setAttribute('y2',by-sl*sc);
 var nw=w-lr*g;
 $('#arw').setAttribute('d','M'+bx+' '+(by+22)+' L'+px(nw)+' '+(by+22));
 var m=$('#msg');
 if(Math.abs(nw-3)>Math.abs(w-3)){m.textContent='\u03b7 \u592a\u5927\u4e86 \u2014\u2014 \u4e00\u6b65\u8fc8\u8fc7\u5934\uff0c\u79bb\u7897\u5e95\u66f4\u8fdc\u4e86';m.style.color='var(--hot)'}
 else if(lr<.04){m.textContent='\u03b7 \u5f88\u5c0f \u2014\u2014 \u65b9\u5411\u5bf9\uff0c\u4f46\u8981\u8d70\u5f88\u591a\u6b65';m.style.color='var(--ink-3)'}
 else{m.textContent='\u6b63\u5728\u7a33\u7a33\u5f80\u7897\u5e95\u8d70';m.style.color='var(--ok)'}}
$('#lr').oninput=function(){lr=+this.value;$('#lrv').textContent=lr.toFixed(2);draw()};
$('#b1').onclick=function(){w=Math.max(-2,Math.min(9,w-lr*2*(w-3)));draw()};
$('#b3').onclick=function(){w=W0;draw()};
$('#b2').onclick=async function(){if(run)return;run=true;
 for(var i=0;i<12;i++){w=Math.max(-2,Math.min(9,w-lr*2*(w-3)));draw();await sleep(180)}run=false};
draw();
})();
</script>
<script src="widget.js"></script>
